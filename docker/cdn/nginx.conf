# CDN для изображений галереи: cdn.virtgal.ru → кэш nginx → приложение (/media/…)
# Приложение само строит WebP-миниатюры (из загрузок и из S3), nginx лишь хранит их близко к пользователю
# и снимает нагрузку с Node. Если CDN недоступен, приложение отдаёт то же самое напрямую.
#
# Образ: nginxinc/nginx-unprivileged (порт 8080, без root).

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  # Журнал без query-строк и заголовков — лишнего не пишем
  log_format cdn '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $upstream_cache_status';
  access_log /dev/stdout cdn;
  error_log  /dev/stderr warn;

  proxy_temp_path       /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Дисковый кэш: до 2 ГБ, держим 60 дней без обращений
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:50m max_size=2g inactive=60d use_temp_path=off;

  server {
    listen 8080;
    server_name _;

    location = /health { access_log off; return 200 "ok\n"; }

    location /media/t/ {
      limit_except GET HEAD { deny all; }

      proxy_pass http://virtual-gallery:5000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;

      proxy_cache media;
      proxy_cache_key $uri;                      # без query: ключ — только путь
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_valid 502 503 504 10s;
      proxy_cache_lock on;                       # одну миниатюру строит один запрос, остальные ждут
      proxy_cache_lock_timeout 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;

      proxy_read_timeout 60s;                    # первая сборка миниатюры из S3 может занять время
      add_header X-Cache-Status $upstream_cache_status always;
      # Cache-Control, CORS и CORP приходят от приложения (immutable, ACAO *)
    }

    location / { return 404; }
  }
}
