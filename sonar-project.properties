# SonarQube configuration for Virtual Gallery Project
sonar.projectKey=virtual-gallery
sonar.organization=virtual-gallery-org
sonar.projectName=Virtual Gallery
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.tests=src/__tests__,src/**/__tests__

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/frontend/**,**/*.test.ts,**/*.spec.ts

# Test reports
sonar.testExecutionReportPaths=reports/test-report.xml
sonar.coverageReportPaths=coverage/lcov.info

# File encodings
sonar.sourceEncoding=UTF-8