version: '3.8'

services:
  # AI/ML API Gateway (Node.js) - Production
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"  # только с самого сервера (шлюз к удалению, см. docs/AI-ML-DESIGN.md)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tulubyev:CHANGE_ME@your-db-host:5432/aimlservice_db
      - QDRANT_URL=https://your-cluster.cloud.qdrant.io:6333
      - QDRANT_API_KEY=your-qdrant-api-key
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-default_prod_jwt_secret_change_this}
      - MAIN_APP_WEBHOOK_URL=https://your-gallery-domain.com/webhooks/ai-results
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant vector database (using Qdrant Cloud - no local instance needed)
  # Qdrant Cloud URL: https://your-cluster.cloud.qdrant.io:6333

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # AI/ML Core Service (Python) for production
  ai-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    # порты наружу не публикуются: ядро вызывает основное приложение по внутренней сети Docker
    environment:
      - ENVIRONMENT=production
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?задайте INTERNAL_API_TOKEN в .env}
      - DATABASE_URL=postgresql://tulubyev:CHANGE_ME@your-db-host:5432/aimlservice_db
      - QDRANT_URL=https://your-cluster.cloud.qdrant.io:6333
      - QDRANT_API_KEY=your-qdrant-api-key
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:

networks:
  default:
    name: ai-ml-prod-network