# Дымовой стек для проверки образа ядра на настоящих контейнерах (CI и локально):
#   docker compose -f docker-compose.smoke.yml up -d --build --wait
#   scripts/smoke.sh
#   docker compose -f docker-compose.smoke.yml down -v
# Пароли здесь — тестовые и существуют только внутри этого стека; в проде значения задаёт docker-compose.prod.yml из .env.
name: ai-core-smoke

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke-pw-not-a-secret
      POSTGRES_DB: virtgal_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d virtgal_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.9.7
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  ai-core:
    image: virtgal-ai-core:smoke
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://smoke:smoke-pw-not-a-secret@postgres:5432/virtgal_ai
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_TOKEN: smoke-internal-token-0123456789
      LLM_API_KEY: smoke-llm-key-not-real
      FETCH_ALLOWED_HOSTS: example.org
    ports:
      - "127.0.0.1:18001:8001"
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}
