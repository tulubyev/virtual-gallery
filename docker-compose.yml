version: '3.8'

services:
  virtual-gallery:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
