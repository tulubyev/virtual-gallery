name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Тесты торгового движка (src/test/database) идут на настоящем PostgreSQL; без TEST_DATABASE_URL они пропускаются
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test_pw
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app_test:app_test_pw@127.0.0.1:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix src/frontend ci
      - name: Typecheck (backend)
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest
      - name: Build (виджеты + React SPA)
        run: npm run build && npm --prefix src/frontend run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (проверка образа, без push)
        run: docker build -t virtual-gallery:ci .

  # Python-ядро ИИ (ai-ml-service): тесты на настоящем PostgreSQL, внешние сервисы в тестах подменены
  ai-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiml_test
          POSTGRES_PASSWORD: aiml_test_pw
          POSTGRES_DB: aiml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiml_test -d aiml_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-ml-service
    env:
      TEST_DATABASE_URL: postgresql://aiml_test:aiml_test_pw@127.0.0.1:5432/aiml_test
      # Обязательные настройки ядра для импорта в тестах (значения тестовые)
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      INTERNAL_API_TOKEN: test-internal-token-0123456789
      LLM_API_KEY: test-llm-key-not-real
      FETCH_ALLOWED_HOSTS: example.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-ml-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Тесты ядра
        run: python -m pytest -q -p no:cacheprovider

  # Образ ядра и стек из контейнеров: ядро + PostgreSQL + Qdrant + Redis (миграции, health, доступ по токену, очередь, выбор моделей)
  ai-core-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа и запуск стека
        run: docker compose -f ai-ml-service/docker-compose.smoke.yml up -d --build --wait
      - name: Дымовой тест
        run: ai-ml-service/scripts/smoke.sh
      - name: Логи при сбое
        if: failure()
        run: docker compose -f ai-ml-service/docker-compose.smoke.yml logs --tail=100
      - name: Остановка стека
        if: always()
        run: docker compose -f ai-ml-service/docker-compose.smoke.yml down -v
