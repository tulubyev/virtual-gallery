# Virtual Gallery — virtgal.ru (VPS 90.156.168.149)
# На сервере (/var/www/virtual-gallery):
#   cp .env.example .env     # заполнить, chmod 600
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Traefik подхватывает контейнер по labels (сеть traefik-public, порты наружу не публикуем).
# БД — системный PostgreSQL 16 на хосте (172.28.0.1:5432), база virtual_gallery_db уже есть.
# ВАЖНО: `npm run init-db` удаляет все таблицы — на боевой БД не запускать.

services:
  virtual-gallery:
    build: .
    container_name: virtual-gallery
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"
    volumes:
      # Загруженные изображения (раньше жили в Replit). Владелец каталога — uid 1000 (node):
      #   chown -R 1000:1000 public/uploads
      - ./public/uploads:/app/public/uploads
    networks:
      - traefik-public
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # virtgal.ru → приложение (API, SPA, Socket.IO)
      - "traefik.http.routers.virtgal.rule=Host(`virtgal.ru`)"
      - "traefik.http.routers.virtgal.entrypoints=websecure"
      - "traefik.http.routers.virtgal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.virtgal.service=virtgal"
      - "traefik.http.services.virtgal.loadbalancer.server.port=5000"
      # www.virtgal.ru → 301 на virtgal.ru
      - "traefik.http.routers.virtgal-www.rule=Host(`www.virtgal.ru`)"
      - "traefik.http.routers.virtgal-www.entrypoints=websecure"
      - "traefik.http.routers.virtgal-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.virtgal-www.middlewares=virtgal-www-redirect"
      - "traefik.http.routers.virtgal-www.service=noop@internal"
      - "traefik.http.middlewares.virtgal-www-redirect.redirectregex.regex=^https://www\\.virtgal\\.ru/(.*)"
      - "traefik.http.middlewares.virtgal-www-redirect.redirectregex.replacement=https://virtgal.ru/$${1}"
      - "traefik.http.middlewares.virtgal-www-redirect.redirectregex.permanent=true"

  # ── CDN для изображений (cdn.virtgal.ru) ──────────────────────────────────────
  # Нужна DNS-запись cdn.virtgal.ru → 90.156.168.149 и CDN_BASE_URL=https://cdn.virtgal.ru в .env.
  # Без этого сайт работает как обычно, картинки отдаёт само приложение.
  cdn:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: virtual-gallery-cdn
    restart: always
    depends_on:
      - virtual-gallery
    expose:
      - "8080"
    volumes:
      - ./docker/cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - cdn-cache:/var/cache/nginx
    networks:
      - traefik-public
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.virtgal-cdn.rule=Host(`cdn.virtgal.ru`)"
      - "traefik.http.routers.virtgal-cdn.entrypoints=websecure"
      - "traefik.http.routers.virtgal-cdn.tls.certresolver=letsencrypt"
      - "traefik.http.services.virtgal-cdn.loadbalancer.server.port=8080"

volumes:
  cdn-cache:

networks:
  traefik-public:
    name: traefik-public
    external: true
