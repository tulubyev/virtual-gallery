<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Virtual Art Gallery - 3D Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #111111;
        }
        
        #gallery-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .controls-hint span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .controls-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: background 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        
        .room-select {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .room-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .room-btn:hover {
            background: rgba(99, 102, 241, 0.6);
            border-color: rgba(99, 102, 241, 0.8);
        }
        
        .room-btn.active {
            background: rgba(99, 102, 241, 0.8);
            border-color: #6366f1;
        }
        
        @media (max-width: 768px) {
            .controls-hint {
                bottom: 70px;
                left: 10px;
                font-size: 11px;
                padding: 8px 12px;
            }
            
            .room-select {
                flex-wrap: wrap;
                justify-content: center;
                padding: 0 20px;
                bottom: 15px;
            }
            
            .room-btn {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div style="text-align: center; color: white;">
            <div style="margin-bottom: 30px;">
                <svg width="80" height="80" viewBox="0 0 100 100" style="animation: spin 2s linear infinite;">
                    <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="none"/>
                    <circle cx="50" cy="50" r="40" stroke="#6366f1" stroke-width="8" fill="none" 
                            stroke-dasharray="251" stroke-dashoffset="200" stroke-linecap="round"/>
                </svg>
            </div>
            <h2 style="font-size: 24px; margin-bottom: 10px; font-weight: 600; font-family: 'Playfair Display', serif;">
                Virtual Art Gallery
            </h2>
            <div style="width: 280px; margin: 20px auto 0;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span id="loading-progress-text" style="font-size: 13px; color: rgba(255,255,255,0.7);">Инициализация...</span>
                    <span id="loading-progress-percent" style="font-size: 13px; color: rgba(255,255,255,0.5);">0%</span>
                </div>
                <div style="width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
                    <div id="loading-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #a78bfa); border-radius: 2px; transition: width 0.4s ease;"></div>
                </div>
            </div>
        </div>
        <style>
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <canvas id="gallery-canvas"></canvas>

    <a href="/" class="back-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        На главную
    </a>

    <div class="room-select" id="room-select"></div>

    <div class="controls-hint">
        <span><kbd>ЛКМ + Drag</kbd> Вращение</span>
        <span><kbd>Колесо</kbd> Масштаб</span>
        <span><kbd>M</kbd> Мини-карта</span>
        <span><kbd>1-5</kbd> Переход в зал</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
            "three/examples/jsm/environments/RoomEnvironment.js": "https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js"
        }
    }
    </script>
    
    <script type="module" src="/js/gallery/main.js"></script>

    <script>
        async function buildRoomButtons() {
            let rooms = [];
            try {
                const res = await fetch('/api/gallery/config');
                if (res.ok) {
                    const config = await res.json();
                    if (config.rooms) rooms = config.rooms;
                }
            } catch(e) {}
            if (rooms.length === 0) {
                rooms = [
                    { id: 'main_hall', name: 'Холл' },
                    { id: 'impressionism', name: 'Импрессионизм' },
                    { id: 'modern_art', name: 'Модерн' },
                    { id: 'renaissance', name: 'Ренессанс' },
                    { id: 'contemporary', name: 'XXI век' }
                ];
            }
            const container = document.getElementById('room-select');
            rooms.forEach((room, i) => {
                const btn = document.createElement('button');
                btn.className = 'room-btn' + (i === 0 ? ' active' : '');
                btn.dataset.room = room.id;
                btn.textContent = room.name.length > 15 ? room.name.substring(0, 13) + '…' : room.name;
                btn.addEventListener('click', () => {
                    if (window.virtualGallery && window.virtualGallery.roomNavigator) {
                        window.virtualGallery.roomNavigator.navigateToRoom(room.id);
                        container.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                });
                container.appendChild(btn);
            });
        }
        buildRoomButtons();

        window.addEventListener('roomChanged', (event) => {
            const roomId = event.detail.roomId;
            document.querySelectorAll('.room-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.room === roomId);
            });
        });
    </script>
</body>
</html>
